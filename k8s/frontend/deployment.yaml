apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: estudos

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend

        image: produtos-frontend:v1
        imagePullPolicy: Never

        ports:
        - containerPort: 80